# Nodo de FRONTEND: solo sirve los archivos estáticos del build de React.
# Ya NO hace proxy hacia el backend: eso lo hace el balanceador (balanceador/nginx.conf),
# que recibe /api/* y lo reparte entre backend1, backend2 y backend3.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Identifica qué réplica respondió (hostname del contenedor: frontend1 / frontend2)
    add_header X-Nodo $hostname always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: cualquier ruta que no sea un archivo (/admin/login, /mis-reservas…) devuelve
    # index.html y React Router resuelve la pantalla.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
