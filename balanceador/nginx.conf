# =============================================================================
# NGINX COMO BALANCEADOR DE CARGA — única puerta de entrada de la aplicación
#
#   /api/*  ──► upstream backend_nodos   (backend1, backend2, backend3)
#   /*      ──► upstream frontend_nodos  (frontend1, frontend2)
#
# El navegador solo conoce este Nginx (puerto 80). Los nodos y la base de datos
# viven en redes internas de Docker y no se publican hacia afuera.
# =============================================================================

user  nginx;
worker_processes  auto;                 # un proceso por núcleo de CPU
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;           # conexiones simultáneas por proceso
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log propio: además del pedido, registra QUÉ NODO lo atendió.
    #   $upstream_http_x_nodo → cabecera X-Nodo que devuelve cada nodo (backend1, frontend2…)
    #   $upstream_addr        → IP:puerto al que Nginx se conectó
    # Se ve en vivo con:  docker compose logs -f balanceador
    log_format  balanceo  '$remote_addr [$time_local] "$request" $status '
                          'nodo=$upstream_http_x_nodo addr=$upstream_addr '
                          'tiempo=$upstream_response_time s';
    access_log  /var/log/nginx/access.log  balanceo;

    # -------------------------------------------------------------------------
    # GRUPOS DE NODOS (upstream)
    # Sin otra directiva el algoritmo es ROUND ROBIN: cada pedido va al nodo
    # siguiente de la lista (1 → 2 → 3 → 1 → …). "backend1" es el nombre del
    # servicio en docker-compose.yml; el DNS interno de Docker lo traduce a una IP.
    #
    # max_fails / fail_timeout: si un nodo falla 3 veces seguidas, Nginx lo saca
    # de la rotación durante 10 s y reparte el tráfico entre los que quedan.
    #
    # Otros algoritmos (se cambian agregando UNA línea dentro del upstream):
    #   least_conn;  → al nodo con menos conexiones activas
    #   ip_hash;     → el mismo cliente (IP) siempre cae en el mismo nodo
    #   weight=2     → en un "server": ese nodo recibe el doble de pedidos
    # -------------------------------------------------------------------------
    upstream backend_nodos {
        server backend1:3000  max_fails=3  fail_timeout=10s;
        server backend2:3000  max_fails=3  fail_timeout=10s;
        server backend3:3000  max_fails=3  fail_timeout=10s;
        keepalive 16;                   # reutiliza conexiones con los nodos (más rápido)
    }

    upstream frontend_nodos {
        server frontend1:80  max_fails=3  fail_timeout=10s;
        server frontend2:80  max_fails=3  fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen       80;
        server_name  _;

        # Tamaño máximo de un pedido. Por defecto Nginx rechaza más de 1 MB (error 413) y las
        # imágenes de torneos viajan en base64 (hasta ~2,7 MB). Debe ser >= el límite del backend.
        client_max_body_size  4m;

        # Cabeceras que pasamos a los nodos para que sepan quién es el cliente real
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";          # necesario para keepalive
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Tolerancia a fallas: si un nodo no responde (caído, timeout, 502/503/504),
        # Nginx REINTENTA el mismo pedido en otro nodo sin que el usuario lo note.
        proxy_next_upstream          error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries    3;
        proxy_connect_timeout        3s;
        proxy_read_timeout           30s;

        # Pedidos a la API → grupo de backends
        location /api/ {
            proxy_pass  http://backend_nodos;   # sin barra final: conserva la ruta /api/...
            add_header  X-Upstream $upstream_addr always;   # IP:puerto del nodo que respondió
        }

        # Todo lo demás (la página React) → grupo de frontends
        location / {
            proxy_pass  http://frontend_nodos;
            add_header  X-Upstream $upstream_addr always;
        }

        # Chequeo de salud del propio balanceador (lo usa Docker)
        location = /nginx-health {
            access_log  off;
            default_type text/plain;
            return 200  "ok\n";
        }
    }
}
