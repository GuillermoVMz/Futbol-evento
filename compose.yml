version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: intermateria_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pajeronoduranada
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-empresa/database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -u postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-empresa
      dockerfile: Dockerfile
    container_name: intermateria_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:pajeronoduranada@db:5432/postgres
      JWT_SECRET: clave_secreta_jwt
      JWT_EXPIRES_IN: 8h
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./front-empresa
      dockerfile: Dockerfile
    container_name: intermateria_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: